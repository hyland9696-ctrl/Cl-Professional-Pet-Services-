<!DOCTYPE html>

<head>
<meta charset="utf-8">
<title>Get a Quote | CL Professional Pet Services</title>
<meta name="robots" content="noindex">
<!-- This page exists for the QR code on the yard signs. Nothing on the site
     links here and it is noindex, so traffic through it is a sign scan.
     Tag it before handing off to the quote wizard: sessionStorage is the
     reliable path (same origin), the utm is the fallback when storage is
     blocked, e.g. a private window. -->
<script>
  try { sessionStorage.setItem('lead_src', 'Yard sign QR'); } catch (e) {}
  location.replace('/?utm_source=yardsign&utm_medium=qr#quote');
</script>
<meta http-equiv="refresh" content="0; url=/?utm_source=yardsign&amp;utm_medium=qr#quote">
<style>body{font-family:system-ui,sans-serif;text-align:center;padding:60px 20px;color:#1a1a1a}
    /* WCAG 2.4.7 Focus Visible. Somebody navigating by keyboard - a screen
       reader user, or anyone who cannot hold a mouse - has to be able to see
       where they are. The nav buttons had no visible focus at all, so the
       tab key moved an invisible cursor around the page.
       :focus-visible only shows the ring for keyboard users, so mouse clicks
       still look the way they did. */
    :focus-visible{outline:3px solid #188663;outline-offset:2px;border-radius:4px;}
    a:focus-visible,button:focus-visible,input:focus-visible,
    select:focus-visible,textarea:focus-visible{outline:3px solid #188663;outline-offset:2px;}
    /* On the dark green header the brand ring would disappear, so flip it. */
    .nav a:focus-visible,.topbar a:focus-visible,header a:focus-visible{outline-color:#fff;}
    @media (prefers-reduced-motion: reduce){
      *,*::before,*::after{animation-duration:.01ms !important;animation-iteration-count:1 !important;
        transition-duration:.01ms !important;scroll-behavior:auto !important;}
    }
</style>
  <script src="/meta-pixel.js?v=38fe5a84"></script>
</head>
<body>
<p>Taking you to our quote page&hellip; If nothing happens, <a href="/?utm_source=yardsign&amp;utm_medium=qr#quote">tap here</a>.</p>
</body>
